# https://taskfile.dev

version: '3'

tasks:

  default:
    cmds:
      - task -l
    silent: true

  init:
    desc: Initialises the project
    sources:
      - mise.toml
    generates:
      - mise.lock
    cmds:
      - mise install

  build:
    desc: Builds the image
    sources:
      - Dockerfile
    cmds:
      - img build -t test:latest .

  run:
    desc: Runs the image
    sources:
      - Dockerfile
    cmds:
      - docker run --rm -it test:latest

  test:
    desc: Test the project
    deps:
      - build
    cmds:
      - echo "Implement me"
      - false
